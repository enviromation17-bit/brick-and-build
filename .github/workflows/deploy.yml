name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # VITE_BASE must match "/<repo-name>/" — GitHub Actions fills the
        # repo name in automatically here, so you don't need to edit this.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrites, so a direct visit to
        # e.g. /about would 404. Copying index.html to 404.html means
        # GitHub Pages serves the app for any unmatched path, and React
        # Router then takes over and renders the right page client-side.
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
